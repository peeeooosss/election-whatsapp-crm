<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Campaign Manager - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="logo">📱</div>
        <h1>WhatsApp Campaign Manager</h1>
        <p class="subtitle">Send bulk messages at fraction of Meta's cost</p>

        <div id="authError" class="status-bar error" style="display:none; margin-bottom:12px;"></div>
        <div id="authSuccess" class="status-bar success" style="display:none; margin-bottom:12px;"></div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
            <p class="auth-toggle">Don't have an account? <a id="toggleToRegister">Register free</a></p>
        </form>

        <!-- Register Form -->
        <form id="registerForm" style="display:none;">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="Your name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Min 6 characters" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary">Create Account</button>
            <p class="auth-toggle">Already have an account? <a id="toggleToLogin">Login</a></p>
        </form>
    </div>
</div>
<script src="config.js"></script>
    <script>
    const API = window.API_BASE || '';
    const authError = document.getElementById('authError');
    const authSuccess = document.getElementById('authSuccess');
    function showError(msg) { authError.style.display = 'block'; authError.textContent = msg; }
    function showSuccess(msg) { authSuccess.style.display = 'block'; authSuccess.textContent = msg; }

    document.getElementById('toggleToRegister').onclick = () => {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
        authError.style.display = 'none'; authSuccess.style.display = 'none';
    };
    document.getElementById('toggleToLogin').onclick = () => {
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
        authError.style.display = 'none'; authSuccess.style.display = 'none';
    };

    document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        authError.style.display = 'none';
        try {
            const res = await fetch(API + '/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('loginEmail').value,
                    password: document.getElementById('loginPassword').value,
                }),
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/app';
            } else {
                showError(data.error || 'Login failed');
            }
        } catch { showError('Network error'); }
    };

    document.getElementById('registerForm').onsubmit = async (e) => {
        e.preventDefault();
        authError.style.display = 'none';
        authSuccess.style.display = 'none';
        try {
            const res = await fetch(API + '/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('regName').value,
                    email: document.getElementById('regEmail').value,
                    password: document.getElementById('regPassword').value,
                }),
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                showSuccess('Account created! 20 free messages added. Redirecting...');
                setTimeout(() => { window.location.href = '/app'; }, 1500);
            } else {
                showError(data.error || 'Registration failed');
            }
        } catch { showError('Network error'); }
    };

    if (localStorage.getItem('token')) window.location.href = '/app';
</script>
</body>
</html>
