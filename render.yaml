services:
  - type: web
    name: election-whatsapp-crm
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DEFAULT_COUNTRY_CODE
        value: "91"
      - key: SESSIONS_DIR
        value: /data/sessions
      - key: MIN_DELAY_MS
        value: "30000"
      - key: MAX_DELAY_MS
        value: "55000"
      - key: BATCH_SIZE
        value: "50"
      - key: BATCH_PAUSE_MS
        value: "900000"
      - key: LOG_LEVEL
        value: "silent"
    disk:
      name: whatsapp-sessions-data
      mountPath: /data
      sizeGB: 1
